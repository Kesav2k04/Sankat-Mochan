<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="850" fill="#fdf6e3" />
  
  <!-- Title -->
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#111">SANKAT-MOCHAN • SYSTEM ARCHITECTURE</text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="14" fill="#555">one SOS, and to end - phone -&gt; BLE mesh -&gt; LoRa -&gt; command post -&gt; responder -&gt; back to the victim</text>
  
  <!-- Offline Badge -->
  <rect x="1000" y="30" width="150" height="30" rx="15" fill="#f9e7d9" stroke="#d48c66" stroke-width="2"/>
  <text x="1075" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d48c66" text-anchor="middle">100% OFFLINE</text>
  
  <!-- 01 VICTIM PHONE Block -->
  <rect x="40" y="110" width="1120" height="170" rx="10" fill="#f9e7d9" stroke="#e0cdbc" stroke-width="2"/>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8b5e3c">01 • VICTIM PHONE - KOTLIN 2.0 - JETPACK COMPOSE</text>
  
  <!-- Nodes in 01 -->
  <!-- Quick SOS -->
  <rect x="60" y="150" width="160" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="140" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Quick SOS</text>
  <text x="140" y="195" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">one tap - GPS attached</text>

  <!-- IndicConformer -->
  <rect x="260" y="150" width="180" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="350" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">ON-DEVICE STT - HEXAGON NPU</text>
  <text x="350" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IndicConformer CTC</text>
  <text x="350" y="215" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">ONNX Runtime - 13 languages</text>
  
  <!-- Gemma 4 -->
  <rect x="480" y="150" width="200" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="580" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">ON-DEVICE LLM - GEMMA 4 E2B</text>
  <text x="580" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sahayak - Gemma 4 E2B</text>
  <text x="580" y="215" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">QLoRA Fine-tune - GGUF Q4_0</text>
  
  <!-- SOS Envelope -->
  <rect x="720" y="150" width="180" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="810" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">MESH PACKET</text>
  <text x="810" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SOS Envelope</text>
  <text x="810" y="215" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">compact 350B - dedup 10</text>

  <!-- Offline maps -->
  <rect x="940" y="150" width="160" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1020" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Offline maps</text>
  <text x="1020" y="195" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">osmdroid - offline tiles</text>
  
  <!-- Arrows for 01 -->
  <line x1="220" y1="180" x2="250" y2="180" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="180" x2="470" y2="180" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="180" x2="710" y2="180" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 02 MESH TRANSPORT Block -->
  <rect x="40" y="300" width="1120" height="170" rx="10" fill="#dfe7f5" stroke="#cbd6eb" stroke-width="2"/>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3c5b8b">02 • MESH TRANSPORT - NO INTERNET - STORE-AND-FORWARD</text>

  <!-- Nodes in 02 -->
  <rect x="60" y="350" width="200" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="160" y="370" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">RASPBERRY PI 4B</text>
  <text x="160" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Gateway Node</text>
  <text x="160" y="415" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">LoRa RX/TX - uplink to command</text>

  <rect x="300" y="400" width="160" height="50" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="380" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Arduino UNO Q Beacon</text>
  
  <rect x="500" y="350" width="200" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">RASPBERRY PI 4B</text>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Field Node</text>
  <text x="600" y="415" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">BLE central - LoRa Sx1278</text>

  <rect x="800" y="350" width="200" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="900" y="370" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">PHONE -&gt; PHONE</text>
  <text x="900" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BLE GATT Mesh</text>
  <text x="900" y="415" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">MTU 257 - max 15 hops</text>
  
  <!-- Inter-block Arrows -->
  <!-- SOS Envelope down to BLE GATT Mesh -->
  <path d="M 810 230 L 810 270 L 900 270 L 900 340" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <line x1="800" y1="390" x2="710" y2="390" stroke="#2c5cc5" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="755" y="380" font-family="Arial, sans-serif" font-size="10" fill="#2c5cc5" text-anchor="middle">BLE direct</text>

  <line x1="500" y1="390" x2="270" y2="390" stroke="#c55c2c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="385" y="380" font-family="Arial, sans-serif" font-size="10" fill="#c55c2c" text-anchor="middle">LoRa 433 MHz - SF9</text>

  <line x1="380" y1="400" x2="380" y2="390" stroke="#c55c2c" stroke-width="2" marker-end="url(#arrow-orange)"/>


  <!-- 03 COMMAND POST Block -->
  <rect x="40" y="490" width="1120" height="170" rx="10" fill="#e8f3e5" stroke="#c9dfc3" stroke-width="2"/>
  <text x="60" y="515" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4d7743">03 • COMMAND POST - SNAPDRAGON X ELITE - FASTAPI - ALL LOCAL</text>
  
  <!-- Nodes in 03 -->
  <rect x="60" y="530" width="220" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="170" y="550" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">STT - ASSEMBLED - M1T</text>
  <text x="170" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IndicConformer-600M</text>
  <text x="170" y="595" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">CPU by design - NPU steps</text>
  
  <!-- Gateway to Command Post Arrow -->
  <line x1="160" y1="430" x2="160" y2="520" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="475" font-family="Arial, sans-serif" font-size="10" fill="#555">WebSocket/HTTP</text>
  
  <rect x="320" y="530" width="220" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="430" y="550" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">TRIAGE - TRANSLATION</text>
  <text x="430" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Gemma 4 on the NPU</text>
  <text x="430" y="595" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">urgency 1-5 - Indic -&gt; English</text>

  <rect x="580" y="530" width="220" height="80" rx="8" fill="#111" stroke="#111" stroke-width="1.5"/>
  <text x="690" y="550" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">DETERMINISTIC CORE</text>
  <text x="690" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Cluster - Dedup - Rank</text>
  <text x="690" y="595" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">LLM scoped tool - never drives control</text>
  
  <rect x="840" y="530" width="200" height="80" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="940" y="550" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">LIVE OPS DASHBOARD</text>
  <text x="940" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Control Room</text>
  <text x="940" y="595" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">React 19 - MapLibre GL</text>
  
  <line x1="280" y1="570" x2="310" y2="570" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="570" x2="570" y2="570" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="570" x2="830" y2="570" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- 04 RESPONSE Block -->
  <rect x="40" y="680" width="1120" height="120" rx="10" fill="#d5eedd" stroke="#b2d6bc" stroke-width="2"/>
  <text x="60" y="705" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3b6946">04 • RESPONSE - THE RETURN PATH</text>

  <!-- Nodes in 04 -->
  <rect x="840" y="720" width="200" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="940" y="745" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Responder Accepts</text>
  <text x="940" y="765" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">POST /accept - first-write-wins lock</text>
  
  <!-- Command Room to Responder -->
  <line x1="940" y1="610" x2="940" y2="710" stroke="#25863c" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="950" y="660" font-family="Arial, sans-serif" font-size="10" fill="#25863c">Responder taps Accept</text>
  
  <rect x="80" y="720" width="200" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="180" y="745" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Victim Notified</text>
  <text x="180" y="765" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">in their own language</text>
  
  <line x1="830" y1="750" x2="290" y2="750" stroke="#25863c" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="560" y="740" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#25863c" text-anchor="middle">« HELP IS ON THE WAY »</text>
  <text x="560" y="765" font-family="Arial, sans-serif" font-size="10" fill="#25863c" text-anchor="middle">same chain: reversed -&gt; gateway -&gt; LoRa -&gt; BLE mesh -&gt; phone</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c5cc5" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c55c2c" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#25863c" />
    </marker>
  </defs>
</svg>
